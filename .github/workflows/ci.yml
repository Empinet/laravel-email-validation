name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "^8.0"
            testbench: "^6.0"
            php: "8.0"
          - laravel: "^9.0"
            testbench: "^7.0"
            php: "8.1"
          - laravel: "^10.0"
            testbench: "^8.0"
            php: "8.2"
          - laravel: "^11.0"
            testbench: "^9.0"
            php: "8.2"
          - laravel: "^12.0"
            testbench: "^10.0"
            php: "8.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          tools: composer:v2

      - name: Align Laravel dependencies
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/validation:${{ matrix.laravel }}" \
            --no-update

      - name: Remove Larastan for Laravel 12
        if: matrix.laravel == '^12.0'
        run: composer remove larastan/larastan --dev --no-update

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
